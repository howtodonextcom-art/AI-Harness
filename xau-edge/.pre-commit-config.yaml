# Optional: install with `uv run pre-commit install` (pre-commit is not a project dependency).
# CI remains the authoritative gate; these hooks only catch problems earlier.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy --strict
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: block-env-files
        name: block .env files
        entry: uv run python scripts/block_env_files.py
        language: system
        types: [file]
