name: xau-edge-ci

on:
  push:
    paths:
      - "xau-edge/**"
      - ".github/workflows/xau-edge-ci.yml"
  pull_request:
    paths:
      - "xau-edge/**"
      - ".github/workflows/xau-edge-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: xau-edge
    steps:
      # Actions are pinned to commit SHAs (tag shown in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.14"
      - name: Install (fails if uv.lock is out of date)
        run: uv sync --locked --extra ml --extra api --python ${{ matrix.python }}
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (no MT5 terminal in CI)
        run: uv run pytest -m "not mt5"

  dashboard:
    name: dashboard (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: xau-edge/apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The runner image ships Node; the lock file pins every package.
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      # The build generates the route types (LayoutProps, next-env.d.ts) that tsc needs.
      - name: Build
        run: npm run build
      - name: Type check
        run: npx tsc --noEmit

  dashboard-e2e:
    name: dashboard browser (mock API, real-backend goldens, axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: dashboard
    defaults:
      run:
        working-directory: xau-edge/apps/dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install
        run: npm ci
      # The browser binary is not in the lock file: it is downloaded for the pinned Playwright version.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      # Every API payload in these tests is a golden written by the real backend
      # (scripts/generate_trade_goldens.py); tests/unit/trading/test_contract_goldens.py keeps them honest.
      # No MT5, no live data, no network: the suite is deterministic. It includes the axe accessibility checks.
      - name: Playwright (mock API)
        run: npx playwright test --workers=2
